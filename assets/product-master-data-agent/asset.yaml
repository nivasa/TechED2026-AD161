apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: product-master-data-agent
  description: AI agent that answers natural language questions about SAP S/4HANA product master data for Sales Representatives via Joule

provides:
  apis:
    - name: product-master-data-agent
      kind: a2a
      ordId: customer.build:apiResource:product-master-data-b3aa0.product-master-data-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-product-srv-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:product-master-data-b3aa0.sap-s4-product-srv-mcp-server:v1
  - name: sap-s4-clfn-product-srv-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:product-master-data-b3aa0.sap-s4-clfn-product-srv-mcp-server:v1
  - name: sap-s4-salesprice-0001-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:product-master-data-b3aa0.sap-s4-salesprice-0001-mcp-server:v1
  - name: sap-s4-slspricingconditionrecord-srv-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:product-master-data-b3aa0.sap-s4-slspricingconditionrecord-srv-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
